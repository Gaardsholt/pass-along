name: Test

on:
  pull_request:

concurrency:
  group: ${{ format('{0}-test-{1}', github.event.repository.name, github.head_ref || github.ref_name) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Run snapshot action
        uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921 # v2.0.3
        with:
          go-mod-path: "go.mod"

      - name: Fuzz tests
        run: |
          fuzztime=10s

          while IFS= read -r package; do
            targets=$(go test "$package" -run=^$ -list '^Fuzz' | grep '^Fuzz' || true)
            if [[ -z "$targets" ]]; then
              continue
            fi

            while IFS= read -r target; do
              echo "Fuzzing ${package}/${target}"
              go test "$package" -run=^$ -fuzz="^${target}$" -fuzztime="$fuzztime"
            done <<< "$targets"
          done < <(go list ./...)

      - name: Go format
        run: |
          go fmt ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: "--fix"

      - name: Suggest changes
        if: always()
        uses: reviewdog/action-suggester@ac5ce6d94e35c00530447dc63c271e38e4fd36c6 # v1.26.3
        with:
          tool_name: go static analysis
